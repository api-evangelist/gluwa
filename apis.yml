aid: gluwa
name: Gluwa
description: >-
  Gluwa is a borderless financial platform and blockchain infrastructure company that
  connects emerging markets to the global economy. Its consumer surface is the Gluwa
  Wallet, Dashboard, Invest (Investor DAO / fixed-term interest accounts) and Exchange,
  backed by the Gluwacoin interoperable stablecoin standard (USDG, KRWG, NGNG). Gluwa
  exposes a REST API (balances, fees, transactions, payment QR codes, wrap/unwrap, and
  an Exchange API for quotes, orders and order books) secured with API keys and address
  signatures, with webhooks and idempotent transaction requests. Gluwa also builds and
  operates Creditcoin, an EVM-compatible layer-1 blockchain, and the Universal Smart
  Contract (USC) multichain framework, shipping TypeScript, Solidity, PHP, .NET and Java
  SDKs. Originally surfaced as a 500 Global portfolio company.
